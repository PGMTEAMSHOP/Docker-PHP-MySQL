version: "3.8"
services:
  php-apache:
    build: .
    image: php_apache
    container_name: php_apache
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:80"
    
  db:
    image: mysql:latest
    container_name: mysql
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_project_db
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: